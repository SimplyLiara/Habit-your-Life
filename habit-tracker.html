<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagesordner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#EDEEE9;
  --surface:#FFFFFF;
  --ink:#24291F;
  --ink-soft:#6B7263;
  --ink-faint:#9BA095;
  --line:#DBDCD3;
  --line-soft:#E8E9E2;
  --personal:#3D5A80;
  --personal-soft:#E4EAF1;
  --shared:#BC6C25;
  --shared-soft:#F5E7D8;
  --done:#588157;
  --done-soft:#E4EBE1;
  --danger:#A6432C;
  --radius:12px;
  --radius-sm:8px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
}

#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ---------- Header ---------- */
header{
  padding:22px 20px 14px;
  border-bottom:1px solid var(--line);
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.wordmark{
  font-family:'Fraunces',serif;
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.01em;
}
.today-date{
  font-size:12.5px;
  color:var(--ink-soft);
  text-align:right;
  line-height:1.4;
}
.today-date .big{
  display:block;
  font-family:'Fraunces',serif;
  font-size:15px;
  color:var(--ink);
  font-weight:500;
}

/* ---------- Main scroll area ---------- */
main{
  flex:1;
  overflow-y:auto;
  padding:18px 20px 100px;
}

.section-title{
  font-family:'Fraunces',serif;
  font-size:17px;
  font-weight:600;
  margin:0 0 4px;
}
.section-sub{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:0 0 14px;
}

.empty-state{
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:22px 18px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13.5px;
  line-height:1.5;
}

/* ---------- Cards / rows ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:10px;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

/* Checkbox */
.check{
  flex:none;
  width:23px;
  height:23px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .15s, border-color .15s;
}
.check svg{
  width:12px; height:12px;
  opacity:0;
  transition:opacity .15s;
}
.check.on{ background:var(--done); border-color:var(--done); }
.check.on svg{ opacity:1; }
.check.on svg path{ stroke:white; }

/* Habit item */
.habit-item{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.habit-top{
  display:flex;
  align-items:center;
  gap:12px;
}
.habit-name{
  flex:1;
  font-size:14.5px;
  font-weight:500;
}
.habit-streak{
  font-size:11.5px;
  color:var(--ink-soft);
  white-space:nowrap;
}
.habit-streak b{ color:var(--ink); font-weight:600; }
.habit-week{
  display:flex;
  gap:5px;
  padding-left:35px;
}
.day-dot{
  width:20px; height:20px;
  border-radius:6px;
  background:var(--line-soft);
  border:1px solid var(--line-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  color:var(--ink-faint);
  cursor:pointer;
  flex:1;
}
.day-dot.filled{ background:var(--habit-color, var(--done)); border-color:var(--habit-color, var(--done)); color:transparent;}
.day-dot.today{ box-shadow:0 0 0 1.5px var(--ink); }
.habit-del{
  flex:none;
  border:none;
  background:none;
  color:var(--ink-faint);
  font-size:18px;
  cursor:pointer;
  padding:0 2px;
  line-height:1;
}

/* Todo item */
.todo-item .row{ align-items:flex-start; }
.todo-text{
  flex:1;
  font-size:14.5px;
  padding-top:2px;
  line-height:1.4;
}
.todo-text.done{
  color:var(--ink-faint);
  text-decoration:line-through;
}
.todo-del{
  flex:none;
  border:none;
  background:none;
  color:var(--ink-faint);
  font-size:18px;
  cursor:pointer;
  padding:0 2px;
  line-height:1;
}

/* Event row */
.event-item{
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.event-bar{
  width:3px;
  align-self:stretch;
  border-radius:2px;
  flex:none;
  background:var(--personal);
}
.event-item.shared .event-bar{ background:var(--shared); }
.event-body{ flex:1; }
.event-title{ font-size:14px; font-weight:500; }
.event-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.event-tag{
  display:inline-block;
  font-size:10px;
  font-weight:600;
  padding:2px 7px;
  border-radius:20px;
  background:var(--personal-soft);
  color:var(--personal);
  margin-top:5px;
}
.event-item.shared .event-tag{ background:var(--shared-soft); color:var(--shared); }
.event-del{
  flex:none;
  border:none;
  background:none;
  color:var(--ink-faint);
  font-size:16px;
  cursor:pointer;
  padding:2px;
}

/* ---------- Inputs / forms ---------- */
.input-row{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
input[type=text], input[type=date], input[type=time]{
  font-family:'Inter',sans-serif;
  font-size:14px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  background:var(--surface);
  color:var(--ink);
  outline:none;
  width:100%;
}
input[type=text]:focus, input[type=date]:focus, input[type=time]:focus{
  border-color:var(--ink-soft);
}
.btn{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:600;
  border:none;
  border-radius:var(--radius-sm);
  padding:10px 16px;
  cursor:pointer;
  white-space:nowrap;
}
.btn-primary{ background:var(--ink); color:var(--bg); }
.btn-primary:active{ opacity:.85; }
.btn-ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink);
}

.color-pick{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.color-swatch{
  width:24px; height:24px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid transparent;
}
.color-swatch.sel{ border-color:var(--ink); }

/* ---------- Segmented control ---------- */
.segmented{
  display:flex;
  background:var(--line-soft);
  border-radius:var(--radius-sm);
  padding:3px;
  margin-bottom:16px;
}
.seg-btn{
  flex:1;
  text-align:center;
  padding:8px 0;
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
  border-radius:6px;
  cursor:pointer;
  border:none;
  background:none;
  font-family:'Inter',sans-serif;
}
.seg-btn.active{
  background:var(--surface);
  color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}

/* ---------- Calendar month grid ---------- */
.cal-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.cal-nav button{
  border:1px solid var(--line);
  background:var(--surface);
  width:30px; height:30px;
  border-radius:50%;
  cursor:pointer;
  font-size:14px;
  color:var(--ink);
}
.cal-month-label{
  font-family:'Fraunces',serif;
  font-size:15.5px;
  font-weight:600;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-bottom:16px;
}
.cal-dow{
  text-align:center;
  font-size:10.5px;
  color:var(--ink-faint);
  font-weight:600;
  padding-bottom:4px;
}
.cal-day{
  aspect-ratio:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  font-size:12.5px;
  cursor:pointer;
  position:relative;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line-soft);
}
.cal-day.other-month{ opacity:0.28; }
.cal-day.today{ border-color:var(--ink); font-weight:700; }
.cal-day.selected{ background:var(--ink); color:var(--bg); }
.cal-dots{
  display:flex;
  gap:2px;
  position:absolute;
  bottom:4px;
}
.cal-dot{ width:4px; height:4px; border-radius:50%; }
.cal-day.selected .cal-dots{ display:none; }

.day-panel-title{
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
  margin:0 0 10px;
  text-transform:none;
}

.name-banner{
  background:var(--shared-soft);
  border-radius:var(--radius);
  padding:12px 14px;
  font-size:12.5px;
  color:var(--ink);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:space-between;
}
.name-banner b{ font-weight:700; }
.name-banner button{
  border:none;
  background:none;
  color:var(--shared);
  font-weight:600;
  font-size:12px;
  cursor:pointer;
  text-decoration:underline;
  flex:none;
}

.share-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:16px;
}
.share-box p{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:0 0 10px;
  line-height:1.5;
}
.share-row{
  display:flex;
  gap:8px;
}
.share-row input{
  background:var(--bg);
  font-weight:600;
  letter-spacing:0.02em;
  text-align:center;
}

/* ---------- Bottom nav ---------- */
nav.tabbar{
  position:sticky;
  bottom:0;
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  border:none;
  background:none;
  color:var(--ink-faint);
  font-family:'Inter',sans-serif;
  font-size:10.5px;
  font-weight:600;
  padding:6px 0;
  cursor:pointer;
  border-radius:8px;
}
.tab-btn.active{ color:var(--ink); }
.tab-btn svg{ width:20px; height:20px; }

/* toast */
#toast{
  position:fixed;
  bottom:78px;
  left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--ink);
  color:var(--bg);
  font-size:12.5px;
  padding:9px 16px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s, transform .2s;
  white-space:nowrap;
  z-index:50;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (min-width:481px){
  #app{ min-height:640px; margin:24px 0; border-radius:20px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,0.08); }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-top">
      <div class="wordmark">Tagesordner</div>
      <div class="today-date" id="headerDate"></div>
    </div>
  </header>

  <main id="main"></main>

  <div id="toast"></div>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4l2.5 2.5"/></svg>
      Heute
    </button>
    <button class="tab-btn" data-tab="habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l5 5L20 6"/></svg>
      Habits
    </button>
    <button class="tab-btn" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      Kalender
    </button>
    <button class="tab-btn" data-tab="todos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      To-Dos
    </button>
  </nav>
</div>

<script>
/* ============================================================
   STATE
============================================================ */
const state = {
  habits: [],          // {id,name,color,log:{ "YYYY-MM-DD": true }, createdAt}
  todos: [],           // {id,text,done,createdAt}
  eventsPrivate: [],    // {id,title,date,time,note,createdAt}
  eventsShared: [],     // {id,title,date,time,note,person,color,createdAt}
  username: null,
  tab: 'today',
  calCursor: new Date(),   // month currently shown
  calSelected: todayStr(), // selected day string
  calMode: 'private',      // 'private' | 'shared'
  habitColorSel: '#3D5A80'
};

const HABIT_COLORS = ['#3D5A80','#BC6C25','#588157','#8A5A83','#4A6C6F'];
const PERSON_COLORS = ['#3D5A80','#BC6C25','#588157','#8A5A83','#4A6C6F','#A6432C'];

function todayStr(d){
  const dt = d || new Date();
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============================================================
   STORAGE
============================================================ */
async function loadAll(){
  try{
    const [h, t, ep, un] = await Promise.all([
      safeGet('habits', false),
      safeGet('todos', false),
      safeGet('events-private', false),
      safeGet('username', false)
    ]);
    if(h) state.habits = JSON.parse(h.value);
    if(t) state.todos = JSON.parse(t.value);
    if(ep) state.eventsPrivate = JSON.parse(ep.value);
    if(un) state.username = JSON.parse(un.value);
  }catch(e){ console.error('load error', e); }
  try{
    const es = await safeGet('events-shared', true);
    if(es) state.eventsShared = JSON.parse(es.value);
  }catch(e){ console.error('shared load error', e); }
}

async function safeGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r;
  }catch(e){
    return null;
  }
}

async function saveHabits(){
  try{ await window.storage.set('habits', JSON.stringify(state.habits), false); }
  catch(e){ console.error(e); toast('Konnte nicht speichern'); }
}
async function saveTodos(){
  try{ await window.storage.set('todos', JSON.stringify(state.todos), false); }
  catch(e){ console.error(e); toast('Konnte nicht speichern'); }
}
async function saveEventsPrivate(){
  try{ await window.storage.set('events-private', JSON.stringify(state.eventsPrivate), false); }
  catch(e){ console.error(e); toast('Konnte nicht speichern'); }
}
async function saveEventsShared(){
  try{ await window.storage.set('events-shared', JSON.stringify(state.eventsShared), true); }
  catch(e){ console.error(e); toast('Konnte nicht speichern'); }
}
async function saveUsername(){
  try{ await window.storage.set('username', JSON.stringify(state.username), false); }
  catch(e){ console.error(e); }
}

/* ============================================================
   HEADER
============================================================ */
function renderHeader(){
  const d = new Date();
  const wd = d.toLocaleDateString('de-DE', { weekday:'long' });
  const dm = d.toLocaleDateString('de-DE', { day:'numeric', month:'long' });
  document.getElementById('headerDate').innerHTML = `<span class="big">${wd}</span>${dm}`;
}

/* ============================================================
   TAB SWITCHING
============================================================ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.tab = btn.dataset.tab;
    render();
  });
});

function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  const main = document.getElementById('main');
  if(state.tab === 'today') main.innerHTML = renderToday();
  else if(state.tab === 'habits') main.innerHTML = renderHabits();
  else if(state.tab === 'calendar') main.innerHTML = renderCalendar();
  else if(state.tab === 'todos') main.innerHTML = renderTodos();
  attachHandlers();
}

/* ============================================================
   TODAY
============================================================ */
function renderToday(){
  const ts = todayStr();
  const openTodos = state.todos.filter(t=>!t.done);
  const todaysEvents = [
    ...state.eventsPrivate.filter(e=>e.date===ts).map(e=>({...e, shared:false})),
    ...state.eventsShared.filter(e=>e.date===ts).map(e=>({...e, shared:true}))
  ].sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99'));

  let html = '';

  html += `<div class="section-title">Habits heute</div>`;
  if(state.habits.length === 0){
    html += `<div class="empty-state">Noch keine Habits angelegt. Leg im Tab „Habits” dein erstes an.</div>`;
  } else {
    html += `<div class="card">`;
    state.habits.forEach((h,i)=>{
      const on = !!h.log[ts];
      const mb = i < state.habits.length - 1 ? 'margin-bottom:10px;' : '';
      html += `<div class="row" style="${mb}">
        <div class="check ${on?'on':''}" data-habit-toggle="${h.id}" data-date="${ts}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="flex:1; font-size:14px;">${escapeHtml(h.name)}</div>
        <div class="habit-streak">${streakLabel(h)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="section-title" style="margin-top:22px;">Termine heute</div>`;
  if(todaysEvents.length === 0){
    html += `<div class="empty-state">Keine Termine für heute.</div>`;
  } else {
    todaysEvents.forEach(e=>{
      html += eventCard(e);
    });
  }

  html += `<div class="section-title" style="margin-top:22px;">Offene To-Dos</div>`;
  if(openTodos.length === 0){
    html += `<div class="empty-state">Alles erledigt. 🎉</div>`;
  } else {
    html += `<div class="card">`;
    openTodos.slice(0,6).forEach((t,i)=>{
      html += `<div class="row" style="margin-bottom:${i===Math.min(openTodos.length,6)-1?'0':'10px'};">
        <div class="check" data-todo-toggle="${t.id}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="todo-text">${escapeHtml(t.text)}</div>
      </div>`;
    });
    html += `</div>`;
    if(openTodos.length > 6){
      html += `<div class="section-sub">+ ${openTodos.length-6} weitere in „To-Dos”</div>`;
    }
  }

  return html;
}

function streakLabel(h){
  let streak = 0;
  let d = new Date();
  // if today not done yet, start counting from yesterday
  if(!h.log[todayStr(d)]){
    d.setDate(d.getDate()-1);
  }
  while(h.log[todayStr(d)]){
    streak++;
    d.setDate(d.getDate()-1);
  }
  if(streak === 0) return 'noch keine Serie';
  return `<b>${streak}</b> Tag${streak===1?'':'e'} Serie`;
}

/* ============================================================
   HABITS
============================================================ */
function renderHabits(){
  let html = `<div class="section-title">Habits</div>
  <div class="section-sub">Tippe auf einen Tag, um ihn ab- oder anzuhaken.</div>`;

  html += `<div class="input-row">
    <input type="text" id="newHabitInput" placeholder="Neues Habit, z. B. 10 Min. lesen">
    <button class="btn btn-primary" id="addHabitBtn">+</button>
  </div>`;
  html += `<div class="color-pick" id="habitColorPick">`;
  HABIT_COLORS.forEach(c=>{
    html += `<div class="color-swatch ${c===state.habitColorSel?'sel':''}" style="background:${c}" data-color="${c}"></div>`;
  });
  html += `</div>`;

  if(state.habits.length === 0){
    html += `<div class="empty-state">Noch keine Habits. Leg oben dein erstes an — z. B. „Wasser trinken” oder „Spazieren gehen”.</div>`;
  }

  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    last7.push(d);
  }
  const dowLetters = ['S','M','D','M','D','F','S'];

  state.habits.forEach(h=>{
    html += `<div class="card habit-item">
      <div class="habit-top">
        <div class="check ${h.log[todayStr()]?'on':''}" style="--habit-color:${h.color}" data-habit-toggle="${h.id}" data-date="${todayStr()}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="habit-name">${escapeHtml(h.name)}</div>
        <div class="habit-streak">${streakLabel(h)}</div>
        <button class="habit-del" data-habit-del="${h.id}">&times;</button>
      </div>
      <div class="habit-week">`;
    last7.forEach(d=>{
      const ds = todayStr(d);
      const on = !!h.log[ds];
      const isToday = ds === todayStr();
      html += `<div class="day-dot ${on?'filled':''} ${isToday?'today':''}" style="--habit-color:${h.color}" data-habit-toggle="${h.id}" data-date="${ds}">${dowLetters[d.getDay()]}</div>`;
    });
    html += `</div></div>`;
  });

  return html;
}

/* ============================================================
   TODOS
============================================================ */
function renderTodos(){
  const open = state.todos.filter(t=>!t.done).sort((a,b)=>b.createdAt-a.createdAt);
  const done = state.todos.filter(t=>t.done).sort((a,b)=>b.createdAt-a.createdAt);

  let html = `<div class="section-title">To-Dos</div>
  <div class="section-sub">${open.length} offen · ${done.length} erledigt</div>`;

  html += `<div class="input-row">
    <input type="text" id="newTodoInput" placeholder="Neue Aufgabe...">
    <button class="btn btn-primary" id="addTodoBtn">+</button>
  </div>`;

  if(open.length === 0 && done.length === 0){
    html += `<div class="empty-state">Noch keine Aufgaben. Füg oben deine erste hinzu.</div>`;
  }

  if(open.length){
    html += `<div class="card">`;
    open.forEach((t,i)=>{
      html += `<div class="row todo-item" style="${i<open.length-1?'margin-bottom:12px;':''}">
        <div class="check" data-todo-toggle="${t.id}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="todo-text">${escapeHtml(t.text)}</div>
        <button class="todo-del" data-todo-del="${t.id}">&times;</button>
      </div>`;
    });
    html += `</div>`;
  }

  if(done.length){
    html += `<div class="section-title" style="font-size:14px; margin-top:20px; color:var(--ink-soft);">Erledigt</div>`;
    html += `<div class="card">`;
    done.forEach((t,i)=>{
      html += `<div class="row todo-item" style="${i<done.length-1?'margin-bottom:12px;':''}">
        <div class="check on" data-todo-toggle="${t.id}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="todo-text done">${escapeHtml(t.text)}</div>
        <button class="todo-del" data-todo-del="${t.id}">&times;</button>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

/* ============================================================
   CALENDAR
============================================================ */
function eventCard(e){
  const timeStr = e.time ? e.time + ' Uhr' : 'ganztägig';
  const cls = e.shared ? 'shared' : '';
  let del = e.shared
    ? `<button class="event-del" data-event-del-shared="${e.id}">&times;</button>`
    : `<button class="event-del" data-event-del-private="${e.id}">&times;</button>`;
  return `<div class="card event-item ${cls}">
    <div class="event-bar" style="${e.shared && e.color ? 'background:'+e.color : ''}"></div>
    <div class="event-body">
      <div class="event-title">${escapeHtml(e.title)}</div>
      <div class="event-meta">${timeStr}${e.note?' · '+escapeHtml(e.note):''}</div>
      ${e.shared ? `<div class="event-tag" style="${e.color?('background:'+e.color+'22; color:'+e.color):''}">${escapeHtml(e.person||'Unbekannt')}</div>` : ''}
    </div>
    ${del}
  </div>`;
}

function renderCalendar(){
  const cur = state.calCursor;
  const year = cur.getFullYear();
  const month = cur.getMonth();
  const monthLabel = cur.toLocaleDateString('de-DE', { month:'long', year:'numeric' });

  let html = `<div class="segmented">
    <button class="seg-btn ${state.calMode==='private'?'active':''}" data-calmode="private">Privat</button>
    <button class="seg-btn ${state.calMode==='shared'?'active':''}" data-calmode="shared">Gemeinsam</button>
  </div>`;

  if(state.calMode === 'shared'){
    if(!state.username){
      html += `<div class="share-box">
        <p>Um im gemeinsamen Kalender Termine anzulegen, gib deinen Namen ein. So sehen andere, von wem ein Termin stammt.</p>
        <div class="share-row">
          <input type="text" id="usernameInput" placeholder="Dein Name">
          <button class="btn btn-primary" id="saveUsernameBtn">Speichern</button>
        </div>
      </div>`;
    } else {
      html += `<div class="name-banner">
        <span>Du bist als <b>${escapeHtml(state.username)}</b> im gemeinsamen Kalender unterwegs.</span>
        <button id="changeUsernameBtn">Ändern</button>
      </div>`;
    }
    html += `<div class="share-box">
      <p>Teile den Link zu dieser Seite mit anderen. Jede Person, die den Link öffnet und ihren Namen einträgt, sieht dieselben gemeinsamen Termine und kann eigene hinzufügen.</p>
    </div>`;
  }

  html += `<div class="cal-nav">
    <button data-cal-prev>&larr;</button>
    <div class="cal-month-label">${monthLabel}</div>
    <button data-cal-next>&rarr;</button>
  </div>`;

  html += `<div class="cal-grid">`;
  ['M','D','M','D','F','S','S'].forEach(d=> html += `<div class="cal-dow">${d}</div>`);

  const firstOfMonth = new Date(year, month, 1);
  let startOffset = firstOfMonth.getDay() - 1; // Monday-first
  if(startOffset < 0) startOffset = 6;
  const gridStart = new Date(year, month, 1 - startOffset);

  const eventsBySource = state.calMode === 'private' ? state.eventsPrivate : state.eventsShared;

  for(let i=0;i<42;i++){
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    const ds = todayStr(d);
    const otherMonth = d.getMonth() !== month;
    const isToday = ds === todayStr();
    const isSel = ds === state.calSelected;
    const dayEvents = eventsBySource.filter(e=>e.date===ds);

    let dots = '';
    if(dayEvents.length && !isSel){
      dots = `<div class="cal-dots">`;
      dayEvents.slice(0,3).forEach(e=>{
        const c = state.calMode==='shared' ? (e.color||'#BC6C25') : 'var(--personal)';
        dots += `<div class="cal-dot" style="background:${c}"></div>`;
      });
      dots += `</div>`;
    }

    html += `<div class="cal-day ${otherMonth?'other-month':''} ${isToday?'today':''} ${isSel?'selected':''}" data-cal-day="${ds}">
      ${d.getDate()}${dots}
    </div>`;
  }
  html += `</div>`;

  // Day panel
  const sel = state.calSelected;
  const selDateObj = new Date(sel + 'T00:00:00');
  const selLabel = selDateObj.toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long' });
  html += `<div class="day-panel-title">${selLabel}</div>`;

  html += `<div class="input-row" style="flex-wrap:wrap;">
    <input type="text" id="newEventTitle" placeholder="Titel des Termins" style="flex:2 1 140px;">
    <input type="time" id="newEventTime" style="flex:1 1 90px;">
  </div>
  <div class="input-row">
    <input type="text" id="newEventNote" placeholder="Notiz (optional)">
    <button class="btn btn-primary" id="addEventBtn">+</button>
  </div>`;

  const dayEvents = eventsBySource.filter(e=>e.date===sel).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  if(dayEvents.length === 0){
    html += `<div class="empty-state">Keine ${state.calMode==='shared'?'gemeinsamen ':''}Termine an diesem Tag.</div>`;
  } else {
    dayEvents.forEach(e=>{
      html += eventCard({...e, shared: state.calMode==='shared'});
    });
  }

  return html;
}

/* ============================================================
   EVENT HANDLERS
============================================================ */
function attachHandlers(){
  const main = document.getElementById('main');

  // Habit toggle
  main.querySelectorAll('[data-habit-toggle]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.habitToggle;
      const date = el.dataset.date;
      const h = state.habits.find(x=>x.id===id);
      if(!h) return;
      if(h.log[date]) delete h.log[date];
      else h.log[date] = true;
      render();
      await saveHabits();
    });
  });

  main.querySelectorAll('[data-habit-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.habits = state.habits.filter(h=>h.id!==el.dataset.habitDel);
      render();
      await saveHabits();
      toast('Habit gelöscht');
    });
  });

  const addHabitBtn = document.getElementById('addHabitBtn');
  if(addHabitBtn){
    const doAdd = async ()=>{
      const input = document.getElementById('newHabitInput');
      const name = input.value.trim();
      if(!name) return;
      state.habits.push({ id:uid(), name, color: state.habitColorSel, log:{}, createdAt: Date.now() });
      input.value = '';
      render();
      await saveHabits();
    };
    addHabitBtn.addEventListener('click', doAdd);
    document.getElementById('newHabitInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
  }

  main.querySelectorAll('#habitColorPick [data-color]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.habitColorSel = el.dataset.color;
      render();
    });
  });

  // Todos
  main.querySelectorAll('[data-todo-toggle]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const t = state.todos.find(x=>x.id===el.dataset.todoToggle);
      if(!t) return;
      t.done = !t.done;
      render();
      await saveTodos();
    });
  });
  main.querySelectorAll('[data-todo-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.todos = state.todos.filter(t=>t.id!==el.dataset.todoDel);
      render();
      await saveTodos();
    });
  });
  const addTodoBtn = document.getElementById('addTodoBtn');
  if(addTodoBtn){
    const doAdd = async ()=>{
      const input = document.getElementById('newTodoInput');
      const text = input.value.trim();
      if(!text) return;
      state.todos.push({ id:uid(), text, done:false, createdAt: Date.now() });
      input.value = '';
      render();
      await saveTodos();
    };
    addTodoBtn.addEventListener('click', doAdd);
    document.getElementById('newTodoInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
  }

  // Calendar mode switch
  main.querySelectorAll('[data-calmode]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.calMode = el.dataset.calmode;
      render();
    });
  });

  // Calendar nav
  const prevBtn = main.querySelector('[data-cal-prev]');
  const nextBtn = main.querySelector('[data-cal-next]');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{
    state.calCursor = new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()-1, 1);
    render();
  });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    state.calCursor = new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()+1, 1);
    render();
  });

  main.querySelectorAll('[data-cal-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.calSelected = el.dataset.calDay;
      render();
    });
  });

  // Username
  const saveUsernameBtn = document.getElementById('saveUsernameBtn');
  if(saveUsernameBtn){
    saveUsernameBtn.addEventListener('click', async ()=>{
      const val = document.getElementById('usernameInput').value.trim();
      if(!val) return;
      state.username = val;
      render();
      await saveUsername();
    });
  }
  const changeUsernameBtn = document.getElementById('changeUsernameBtn');
  if(changeUsernameBtn){
    changeUsernameBtn.addEventListener('click', async ()=>{
      state.username = null;
      render();
      await saveUsername();
    });
  }

  // Add event
  const addEventBtn = document.getElementById('addEventBtn');
  if(addEventBtn){
    addEventBtn.addEventListener('click', async ()=>{
      const title = document.getElementById('newEventTitle').value.trim();
      const time = document.getElementById('newEventTime').value;
      const note = document.getElementById('newEventNote').value.trim();
      if(!title) return;

      if(state.calMode === 'private'){
        state.eventsPrivate.push({ id:uid(), title, date:state.calSelected, time, note, createdAt:Date.now() });
        render();
        await saveEventsPrivate();
      } else {
        if(!state.username){ toast('Bitte zuerst deinen Namen eingeben'); return; }
        let color = null;
        // stable-ish color per person name
        let h = 0;
        for(let i=0;i<state.username.length;i++) h = state.username.charCodeAt(i) + ((h<<5)-h);
        color = PERSON_COLORS[Math.abs(h) % PERSON_COLORS.length];
        state.eventsShared.push({ id:uid(), title, date:state.calSelected, time, note, person: state.username, color, createdAt:Date.now() });
        render();
        await saveEventsShared();
      }
      toast('Termin gespeichert');
    });
  }

  main.querySelectorAll('[data-event-del-private]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.eventsPrivate = state.eventsPrivate.filter(e=>e.id!==el.dataset.eventDelPrivate);
      render();
      await saveEventsPrivate();
    });
  });
  main.querySelectorAll('[data-event-del-shared]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.eventsShared = state.eventsShared.filter(e=>e.id!==el.dataset.eventDelShared);
      render();
      await saveEventsShared();
    });
  });
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  renderHeader();
  render(); // render once immediately with empty state so UI isn't blank
  await loadAll();
  render();
})();
</script>
</body>
</html>
